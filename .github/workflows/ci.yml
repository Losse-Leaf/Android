name: Android Client CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Zero Hardcoded Colors in UI Code
        run: |
          # 色值唯一定义处是 theme/Color.kt；UI 层不允许任何硬编码颜色
          # （十六进制字面量、Color.White/Black/Gray 等具名常量、Color.parseColor 均在内）
          VIOLATIONS=$(grep -rnE 'Color\(0x[0-9A-Fa-f]{8}\)|Color\.(White|Black|Gray|Red|Green|Blue|Yellow|Cyan|Magenta|LightGray|DarkGray)\b|Color\.parseColor' \
            app/src/main/java/com/looseleaf/app/ui/ | grep -v "Color.Transparent" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "$VIOLATIONS"
            echo "Found hardcoded color literal in UI code! Use LooseLeafTheme.colors semantic tokens instead."
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace > gradle_test.log 2>&1
          EXIT_CODE=$?
          cat gradle_test.log
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "^e: " gradle_test.log | head -n 20)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(grep -C 3 -i "error" gradle_test.log | head -n 30)
            fi
            ENCODED_ERR=$(echo "$ERR_SUMMARY" | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/\n/%0A/g')
            echo "::error title=Kotlin Compile Error::$ENCODED_ERR"
            exit $EXIT_CODE
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Lint (errors fail the build)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Compile Desktop Mock Preview Studio (preview only, not a UI self-check)
        run: ./gradlew :desktop:classes --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify Release APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error title=产物缺失::未找到 $APK"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "::warning title=跳过签名校验::未找到 apksigner"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
