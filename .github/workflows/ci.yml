name: Android Client CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Zero Hardcoded Colors in UI Code
        run: |
          # 色值唯一定义处是 theme/Color.kt；UI 层不允许任何硬编码颜色
          # （十六进制字面量、Color.White/Black/Gray 等具名常量、Color.parseColor 均在内）
          VIOLATIONS=$(grep -rnE 'Color\(0x[0-9A-Fa-f]{8}\)|Color\.(White|Black|Gray|Red|Green|Blue|Yellow|Cyan|Magenta|LightGray|DarkGray)\b|Color\.parseColor' \
            app/src/main/java/com/looseleaf/app/ui/ | grep -v "Color.Transparent" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "$VIOLATIONS"
            echo "Found hardcoded color literal in UI code! Use LooseLeafTheme.colors semantic tokens instead."
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          set +e
          # MOB-P1-62：引入发行变体后，testDebugUnitTest 变成歧义任务名 ——
          # 必须显式点名两个变体，否则 Gradle 直接报 "Task 'testDebugUnitTest' is ambiguous"
          ./gradlew :app:testPublicDebugUnitTest :app:testLanDebugUnitTest --no-daemon --stacktrace > gradle_test.log 2>&1
          EXIT_CODE=$?
          cat gradle_test.log
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "^e: " gradle_test.log | head -n 20)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(grep -C 3 -i "error" gradle_test.log | head -n 30)
            fi
            ENCODED_ERR=$(echo "$ERR_SUMMARY" | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/\n/%0A/g')
            echo "::error title=Kotlin Compile Error::$ENCODED_ERR"
            exit $EXIT_CODE
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Lint (errors fail the build)
        # MOB-P1-62：lintDebug 同样因变体而歧义，改点名两个变体
        run: ./gradlew :app:lintPublicDebug :app:lintLanDebug --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Compile Desktop Mock Preview Studio (preview only, not a UI self-check)
        run: ./gradlew :desktop:classes --no-daemon

      # MOB-P2-57 / MOB-P2-54：签名密钥与口令都不在仓库里，
      # CI 需要自己从 GitHub Secret 取回（与发布流水线同源）。
      - name: Restore signing keystore from secret
        env:
          LOOSELEAF_KEYSTORE_BASE64: ${{ secrets.LOOSELEAF_KEYSTORE_BASE64 }}
          LOOSELEAF_STORE_PASSWORD: ${{ secrets.LOOSELEAF_STORE_PASSWORD }}
          LOOSELEAF_KEY_PASSWORD: ${{ secrets.LOOSELEAF_KEY_PASSWORD }}
          LOOSELEAF_KEY_ALIAS: ${{ secrets.LOOSELEAF_KEY_ALIAS || 'looseleaf' }}
          # MOB-P1-xx：别名也做成可注入 —— 换密钥时若用了别的别名，
          # CI 就能跟着变，不必去改 build.gradle.kts 里的硬编码。
          LOOSELEAF_KEY_ALIAS: ${{ secrets.LOOSELEAF_KEY_ALIAS || 'looseleaf' }}
        run: |
          if [ -z "$LOOSELEAF_KEYSTORE_BASE64" ] || [ -z "$LOOSELEAF_STORE_PASSWORD" ] || [ -z "$LOOSELEAF_KEY_PASSWORD" ]; then
            echo "::error title=缺少签名凭据::请在仓库 Settings → Secrets and variables → Actions 中添加 LOOSELEAF_KEYSTORE_BASE64 / LOOSELEAF_STORE_PASSWORD / LOOSELEAF_KEY_PASSWORD"
            exit 1
          fi
          echo "$LOOSELEAF_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          chmod 600 app/release.keystore

      - name: Build Release APK
        env:
          LOOSELEAF_STORE_PASSWORD: ${{ secrets.LOOSELEAF_STORE_PASSWORD }}
          LOOSELEAF_KEY_PASSWORD: ${{ secrets.LOOSELEAF_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PLOOSELEAF_STORE_PASSWORD="$LOOSELEAF_STORE_PASSWORD" \
            -PLOOSELEAF_KEY_PASSWORD="$LOOSELEAF_KEY_PASSWORD" \
            -PLOOSELEAF_KEY_ALIAS="$LOOSELEAF_KEY_ALIAS" \
            -Pkotlin.compiler.execution.strategy=in-process

      # MOB-P1-62：公网版与局域网版两个变体都要验签
      - name: Verify Release APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          for APK in app/build/outputs/apk/public/release/app-public-release.apk \
                     app/build/outputs/apk/lan/release/app-lan-release.apk; do
            test -f "$APK" || { echo "::error title=产物缺失::未找到 $APK"; exit 1; }
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK"
            else
              echo "::warning title=跳过签名校验::未找到 apksigner"
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-Android-APK
          # MOB-P1-xx：引入 productFlavors 后，release 产物落在
          # app/build/outputs/apk/<flavor>/release/，旧的 apk/release/ 目录已不存在
          # ⇒ 路径不改的话 upload-artifact 会静默上传空目录
          # （v4 的 if-no-files-found 默认是 warn，不报错，下载时才发现没东西）。
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 30
