name: Android Client CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Zero Hardcoded Hex Colors in UI Code
        run: |
          if grep -rnE 'Color\(0x[0-9A-Fa-f]{8}\)' app/src/main/java/com/looseleaf/app/ui/ | grep -v "Color.Transparent"; then
            echo "Found hardcoded hex color literal in UI code! Use LooseLeafTheme.colors semantic tokens instead."
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace > gradle_test.log 2>&1
          EXIT_CODE=$?
          cat gradle_test.log
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(tail -n 35 gradle_test.log | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/\n/%0A/g')
            echo "::error title=Gradle Build Failure::$ERR_SUMMARY"
            exit $EXIT_CODE
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
