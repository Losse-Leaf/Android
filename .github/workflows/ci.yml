name: Android Client CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Zero Hardcoded Hex Colors in UI Code
        run: |
          if grep -rnE 'Color\(0x[0-9A-Fa-f]{8}\)' app/src/main/java/com/looseleaf/app/ui/ | grep -v "Color.Transparent"; then
            echo "Found hardcoded hex color literal in UI code! Use LooseLeafTheme.colors semantic tokens instead."
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace || {
            echo "=== UNIT TEST FAILED - PRINTING TEST RESULTS ==="
            find app/build/test-results -name "*.xml" -exec cat {} + 2>/dev/null || true
            exit 1
          }

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-Android-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
