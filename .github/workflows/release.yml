name: Android Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify tag matches app versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "tag=$TAG versionName=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error title=版本不一致::tag v$TAG 与 app/build.gradle.kts 的 versionName $VERSION 不一致，更新器会判断错版本"
            exit 1
          fi

      # 发布流水线必须自带质量门禁：tag 触发不经过 main 的 CI，
      # 没有这一步，未经测试与静态检查的代码可以直接产出签名发布包。
      # 单测与 lint 分两步跑：并行的 lintAnalyze 任务偶发与 test 任务抢缓存而误报失败
      - name: Run Unit Tests (release gate)
        run: |
          set +e
          # MOB-P1-62：变体化后必须显式点名（testDebugUnitTest 已成歧义任务名）
          ./gradlew :app:testPublicDebugUnitTest :app:testLanDebugUnitTest --no-daemon -Pkotlin.compiler.execution.strategy=in-process --stacktrace > gradle_test.log 2>&1
          EXIT_CODE=$?
          cat gradle_test.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=门禁未通过::单元测试失败，禁止发布"
            exit $EXIT_CODE
          fi

      - name: Run Lint (release gate)
        run: |
          set +e
          # MOB-P1-62：lintDebug 同样因变体而歧义，改点名两个变体
          ./gradlew :app:lintPublicDebug :app:lintLanDebug --no-daemon -Pkotlin.compiler.execution.strategy=in-process --stacktrace > gradle_lint.log 2>&1
          EXIT_CODE=$?
          cat gradle_lint.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=门禁未通过::lint 存在 error，禁止发布"
            exit $EXIT_CODE
          fi

      # MOB-P2-57：签名口令已从仓库里移出（app/build.gradle.kts 改读 local.properties /
      # -P 参数），因此发布流水线必须**显式注入** GitHub Secret，否则 assembleRelease
      # 会在配置签名时直接失败 —— 仓库里能拿到 secret 的只有这条流水线。
      # MOB-P2-57 / MOB-P2-54：签名密钥文件与口令都不再留在仓库里，
      # 发布流水线从 GitHub Secret 取回密钥并解到 app/release.keystore。
      # 生成 Secret 的命令见 docs/mobile-optimization.md §附录 C。
      - name: Restore signing keystore from secret
        env:
          LOOSELEAF_KEYSTORE_BASE64: ${{ secrets.LOOSELEAF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LOOSELEAF_KEYSTORE_BASE64" ]; then
            echo "::error title=缺少签名密钥::请在仓库 Settings → Secrets and variables → Actions 中添加 LOOSELEAF_KEYSTORE_BASE64（base64 后的 keystore）"
            exit 1
          fi
          echo "$LOOSELEAF_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          chmod 600 app/release.keystore

      - name: Verify signing secrets are present
        env:
          LOOSELEAF_STORE_PASSWORD: ${{ secrets.LOOSELEAF_STORE_PASSWORD }}
          LOOSELEAF_KEY_PASSWORD: ${{ secrets.LOOSELEAF_KEY_PASSWORD }}
          LOOSELEAF_KEY_ALIAS: ${{ secrets.LOOSELEAF_KEY_ALIAS || 'looseleaf' }}
        run: |
          if [ -z "$LOOSELEAF_STORE_PASSWORD" ] || [ -z "$LOOSELEAF_KEY_PASSWORD" ]; then
            echo "::error title=缺少签名口令::请在仓库 Settings → Secrets and variables → Actions 中添加 LOOSELEAF_STORE_PASSWORD 与 LOOSELEAF_KEY_PASSWORD"
            exit 1
          fi

      - name: Build Release APK
        env:
          LOOSELEAF_STORE_PASSWORD: ${{ secrets.LOOSELEAF_STORE_PASSWORD }}
          LOOSELEAF_KEY_PASSWORD: ${{ secrets.LOOSELEAF_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon \
            -PLOOSELEAF_STORE_PASSWORD="$LOOSELEAF_STORE_PASSWORD" \
            -PLOOSELEAF_KEY_PASSWORD="$LOOSELEAF_KEY_PASSWORD" \
            -PLOOSELEAF_KEY_ALIAS="$LOOSELEAF_KEY_ALIAS" \
            -Pkotlin.compiler.execution.strategy=in-process --stacktrace > gradle_release.log 2>&1
          EXIT_CODE=$?
          cat gradle_release.log
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "^e: " gradle_release.log | head -n 20)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(grep -C 3 -i "error" gradle_release.log | head -n 30)
            fi
            ENCODED_ERR=$(echo "$ERR_SUMMARY" | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/\n/%0A/g')
            echo "::error title=Kotlin Compile Error::$ENCODED_ERR"
            exit $EXIT_CODE
          fi

      # MOB-P1-62：两个发行变体都要签名校验 —— 公网版与局域网版用同一把密钥
      - name: Verify APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          for APK in app/build/outputs/apk/public/release/app-public-release.apk \
                     app/build/outputs/apk/lan/release/app-lan-release.apk; do
            test -f "$APK" || { echo "::error title=产物缺失::未找到 $APK"; exit 1; }
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK"
            else
              echo "::warning title=跳过签名校验::未找到 apksigner"
            fi
          done

      - name: Package Artifact
        run: |
          mkdir -p release-artifacts
          # 产物缺失即失败：兜底 cp *.apk 会把任意 APK 冠上正式发布名
          PUB=app/build/outputs/apk/public/release/app-public-release.apk
          LAN=app/build/outputs/apk/lan/release/app-lan-release.apk
          test -f "$PUB" || { echo "::error title=产物缺失::$PUB 不存在"; exit 1; }
          test -f "$LAN" || { echo "::error title=产物缺失::$LAN 不存在"; exit 1; }
          # 命名约定（MOB-P1-62）：
          #   公网版   LooseLeaf-<tag>.apk      ← 保持旧命名，旧版更新器也能挑对
          #   局域网版 LooseLeaf-<tag>.lan.apk  ← 字典序排在公网版之后
          cp "$PUB" "release-artifacts/LooseLeaf-${{ github.ref_name }}.apk"
          cp "$LAN" "release-artifacts/LooseLeaf-${{ github.ref_name }}.lan.apk"
          ls -la release-artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-Android-${{ github.ref_name }}
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          body: |
            散页 (Loose Leaf) Android 正式发布产物。

            ⚠️ **v1.6.3 请手动下载安装，不要用应用内更新**：
            v1.6.3 的「检测到新版本」这条链路有缺陷，一检测到新版就会崩（仅 release 包复现）。
            本版已修好，但崩溃发生在**旧版自己的代码里**，只能靠手动安装绕过。

            ⚠️ **本版起签名密钥已轮换**，因此**无法覆盖安装 1.6.1 及更早的版本**
            （Android 会拒绝签名不一致的覆盖安装）。请按下面的说明升级：

            1. 先在旧版 App 里把改动**同步到中枢**（离线队列清空）——否则卸载会连同
               未同步的本地改动一起清掉；
            2. 卸载旧版，安装本版；本地缓存会从中枢自动重新拉取。

            本次提供两个变体，按你的中枢位置选：
            - `LooseLeaf-<tag>.apk` —— **公网版**：中枢有公网域名，只允许 https；
            - `LooseLeaf-<tag>.lan.apk` —— **局域网版**：中枢在自家局域网，或经
              Tailscale / WireGuard 等组网工具异地访问时使用（允许明文访问私有地址）。

            两个变体包名不同、可以并存；App 内更新会按当前变体自动挑选对应安装包。

            APK 已启用 R8 与资源收缩；下方变更记录由本仓库提交自动生成。
