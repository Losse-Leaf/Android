name: Android Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=in-process --stacktrace > gradle_release.log 2>&1
          EXIT_CODE=$?
          cat gradle_release.log
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "^e: " gradle_release.log | head -n 20)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(grep -C 3 -i "error" gradle_release.log | head -n 30)
            fi
            ENCODED_ERR=$(echo "$ERR_SUMMARY" | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/\n/%0A/g')
            echo "::error title=Kotlin Compile Error::$ENCODED_ERR"
            exit $EXIT_CODE
          fi

      - name: Package Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/LooseLeaf-${{ github.ref_name }}.apk" 2>/dev/null || cp app/build/outputs/apk/release/*.apk "release-artifacts/LooseLeaf-${{ github.ref_name }}.apk"
          ls -la release-artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LooseLeaf-Android-${{ github.ref_name }}
          path: release-artifacts/*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          body: |
            散页 (Loose Leaf) Android 原生移动端正式发布产物（已签名）。
            支持端侧随行暗房 4K 压制直传、极速触觉记账大键盘、离线优先发件箱、KeyStore/生物识别与桌面小组件。
