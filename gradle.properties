org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx1024m -Djava.net.preferIPv4Stack=true
# MOB-P2-58：原先强制编译器在 Gradle daemon 内联执行，
# 配合 -Xmx2560m 容易 OOM 且拖慢增量编译；改回独立 Kotlin daemon。
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.useKSP2=false

org.gradle.parallel=true
org.gradle.caching=true
# MOB-P2-58：512m 元空间在「in-process 编译 + 同时编译两个发行变体」下不够用，
# 发布流水线的单测门禁会直接 OOM（java.lang.OutOfMemoryError: Metaspace）⇒ 提到 1g。
